.form-select:focus-visible {

  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

  height: 20px;

  box-shadow: none;

  position: absolute;
  top: 50%;
  left: 0;

  height: 16px;

  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

  box-shadow: 0 0 0 2px var(--ring);

.form-range {

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    height: 44px;
  }

    margin-top: 12px;

        &lt;div class=&quot;er-form-context&quot; data-role=&quot;assignment-context&quot;&gt;Цикл #120 · PR #301 · запуск #918 / 2 · SHA 8f31bc2&lt;/div&gt;
        &lt;label for=&quot;er-recovery-issue&quot;&gt;Задача из Delivery&lt;/label&gt;
        &lt;select id=&quot;er-recovery-issue&quot; aria-describedby=&quot;er-recovery-candidate&quot;&gt;

        &lt;div class=&quot;er-effect&quot;&gt;&lt;i data-lucide=&quot;lock-keyhole&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Запустится только назначенное исправление. Остальные задачи останутся в ожидании.&lt;/span&gt;&lt;/div&gt;

        &lt;div&gt;&lt;div class=&quot;er-strong&quot;&gt;#122 · Исправить готовность контейнера&lt;/div&gt;&lt;div class=&quot;er-assigned-state&quot; data-role=&quot;assigned-state&quot;&gt;Назначена для восстановления · ожидает запуска&lt;/div&gt;&lt;/div&gt;
        &lt;span class=&quot;er-pill&quot; data-tone=&quot;wait&quot; data-role=&quot;recovery-badge&quot;&gt;Recovery&lt;/span&gt;

      &lt;ul class=&quot;er-validation&quot; data-role=&quot;validation-checks&quot; hidden aria-label=&quot;Проверка работоспособности dev&quot;&gt;
        &lt;li&gt;&lt;span&gt;Проверка приложения&lt;/span&gt;&lt;span class=&quot;er-good-text&quot;&gt;Пройдена&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;span&gt;Scheduler&lt;/span&gt;&lt;span class=&quot;er-good-text&quot;&gt;Проверен&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;span&gt;Queue и доставка&lt;/span&gt;&lt;span data-role=&quot;queue-check&quot; class=&quot;er-wait-text&quot;&gt;Ожидается&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;er-actions&quot; data-role=&quot;manual-actions&quot; hidden&gt;
        &lt;button type=&quot;button&quot; class=&quot;er-primary&quot; data-role=&quot;open-manual&quot;&gt;Подтвердить ручную проверку dev&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-role=&quot;report-problem&quot;&gt;Обнаружена проблема&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;er-form&quot; data-role=&quot;manual-form&quot; hidden&gt;
        &lt;div class=&quot;er-form-heading&quot;&gt;&lt;h3&gt;Результат ручной проверки&lt;/h3&gt;&lt;span class=&quot;er-muted&quot;&gt;Права владельца&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;er-form-context&quot; data-role=&quot;manual-context&quot;&gt;EmotionStat/app · dev · SHA 9b30ac1 · запуск #919 / 1&lt;/div&gt;
        &lt;label for=&quot;er-manual-result&quot;&gt;Результат&lt;/label&gt;
        &lt;select id=&quot;er-manual-result&quot;&gt;
          &lt;option value=&quot;&quot;&gt;Выберите результат проверки&lt;/option&gt;
          &lt;option value=&quot;passed&quot;&gt;Работает — проверка пройдена&lt;/option&gt;
          &lt;option value=&quot;failed&quot;&gt;Обнаружена проблема&lt;/option&gt;

          &lt;legend&gt;Выполненные проверки&lt;/legend&gt;

          &lt;label class=&quot;er-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-check=&quot;scenario&quot;&gt;&lt;span&gt;Контрольный сценарий с тестовыми данными выполнен&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;er-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-check=&quot;services&quot;&gt;&lt;span&gt;Scheduler, Queue и доставка проверены; состояние соответствует ожидаемому&lt;/span&gt;&lt;/label&gt;
        &lt;/fieldset&gt;
        &lt;label class=&quot;er-manual-label&quot; for=&quot;er-manual-note&quot;&gt;Что проверено или какая проблема найдена&lt;/label&gt;
        &lt;textarea id=&quot;er-manual-note&quot; rows=&quot;3&quot; placeholder=&quot;Опишите результат. Можно добавить ссылку на отчёт проверки.&quot;&gt;&lt;/textarea&gt;
        &lt;div class=&quot;er-candidate&quot; data-role=&quot;manual-help&quot; aria-live=&quot;polite&quot;&gt;Для успешного результата подтвердите все проверки и добавьте комментарий.&lt;/div&gt;
        &lt;div class=&quot;er-error&quot; data-role=&quot;manual-stale&quot; role=&quot;alert&quot; hidden&gt;Деплой изменился. Это подтверждение устарело — обновите данные и проверьте новую версию.&lt;/div&gt;
        &lt;div class=&quot;er-effect&quot;&gt;&lt;i data-lucide=&quot;lock-keyhole&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span data-role=&quot;manual-effect&quot;&gt;Очередь откроется после сохранения успешного результата для актуального dev.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;er-actions&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;er-primary&quot; data-role=&quot;save-manual&quot; disabled&gt;Сохранить результат&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-role=&quot;cancel-manual&quot;&gt;Отмена&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;er-record&quot; data-role=&quot;manual-record&quot; hidden aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;er-strong&quot; data-role=&quot;record-title&quot;&gt;Ручная проверка сохранена&lt;/div&gt;
        &lt;div class=&quot;er-muted&quot; data-role=&quot;record-context&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;er-record-note&quot; data-role=&quot;record-note&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;er-actions&quot; data-role=&quot;refresh-actions&quot; hidden&gt;&lt;button type=&quot;button&quot; data-role=&quot;refresh-state&quot;&gt;Обновить данные&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;er-footer&quot;&gt;&lt;span data-role=&quot;footer-state&quot;&gt;Цикл сохранён · ожидается решение владельца&lt;/span&gt;&lt;span data-role=&quot;footer-actor&quot;&gt;Раннер наблюдает за dev&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;es-recovery-console&#x27;);
      const find = (role) =&gt; root.querySelector(&#x27;[data-role=&quot;&#x27; + role + &#x27;&quot;]&#x27;);
      const select = root.querySelector(&#x27;#er-recovery-issue&#x27;);
      const candidate = root.querySelector(&#x27;#er-recovery-candidate&#x27;);
      const resultInput = root.querySelector(&#x27;#er-manual-result&#x27;);
      const noteInput = root.querySelector(&#x27;#er-manual-note&#x27;);
      const checkInputs = [...root.querySelectorAll(&#x27;[data-check]&#x27;)];
      const state = {
        scenario: &#x27;manual_pending&#x27;, validationMode: &#x27;manual&#x27;, details: false, originalMerged: true,
        assigning: false, selection: &#x27;&#x27;, refreshed: false, manualOpen: false,
        result: &#x27;&#x27;, checks: { app: false, scenario: false, services: false }, note: &#x27;&#x27;,
        snapshot: null, record: null, validationFault: false, recoveryPresent: false
      };
      const put = (role, value) =&gt; { find(role).textContent = value; };
      const show = (role, visible) =&gt; { find(role).hidden = !visible; };
      const stage = (role, value, tone) =&gt; { put(role + &#x27;-value&#x27;, value); find(role + &#x27;-stage&#x27;).dataset.tone = tone; };

      function currentDeployment() {
        if (state.scenario === &#x27;manual_stale&#x27; || state.refreshed) return { sha: &#x27;b49a11e&#x27;, run: 920, attempt: 1 };
        if ([&#x27;manual_pending&#x27;, &#x27;manual_failed&#x27;, &#x27;validating&#x27;, &#x27;restored&#x27;].includes(state.scenario) || state.validationFault) return { sha: &#x27;9b30ac1&#x27;, run: 919, attempt: 1 };
        return { sha: &#x27;8f31bc2&#x27;, run: 918, attempt: 2 };
      }
      function snapshotKey() {
        return JSON.stringify({ repo: &#x27;EmotionStat/app&#x27;, branch: &#x27;dev&#x27;, cycle: 120, originalMerged: state.originalMerged, mode: state.validationMode, ...currentDeployment() });
      }
      function canAssign() { return [&#x27;failure&#x27;, &#x27;manual_failed&#x27;].includes(state.scenario); }
      function canValidate() { return state.validationMode === &#x27;manual&#x27; &amp;&amp; [&#x27;manual_pending&#x27;, &#x27;manual_failed&#x27;].includes(state.scenario); }
      function resetManual() {
        state.manualOpen = false; state.result = &#x27;&#x27;; state.note = &#x27;&#x27;; state.snapshot = null;
        state.checks = { app: false, scenario: false, services: false };
      }

      function renderManual() {
        const stale = state.manualOpen &amp;&amp; (state.snapshot !== snapshotKey() || state.scenario === &#x27;manual_stale&#x27;);
        const complete = state.note.trim().length &gt; 0 &amp;&amp; (state.result === &#x27;failed&#x27; || (state.result === &#x27;passed&#x27; &amp;&amp; Object.values(state.checks).every(Boolean)));
        resultInput.value = state.result;
        noteInput.value = state.note;
        checkInputs.forEach(input =&gt; { input.checked = state.checks[input.dataset.check]; });
        find(&#x27;save-manual&#x27;).disabled = !complete || stale || !canValidate();
        put(&#x27;save-manual&#x27;, state.result === &#x27;passed&#x27; ? &#x27;Сохранить подтверждение&#x27; : state.result === &#x27;failed&#x27; ? &#x27;Сохранить проблему&#x27; : &#x27;Сохранить результат&#x27;);
        show(&#x27;manual-stale&#x27;, stale);
        put(&#x27;manual-help&#x27;, state.result === &#x27;failed&#x27; ? &#x27;Опишите проблему. Непройденные проверки можно оставить неотмеченными.&#x27; : &#x27;Для успешного результата подтвердите все проверки и добавьте комментарий.&#x27;);
        put(&#x27;manual-effect&#x27;, state.result === &#x27;failed&#x27; ? &#x27;Проблема сохранится, очередь останется закрытой. Исправление назначается отдельно.&#x27; : state.originalMerged ? &#x27;Очередь откроется после сохранения успешного результата для актуального dev.&#x27; : &#x27;После успешной проверки возобновится задача #120. Следующая задача продолжит ждать.&#x27;);
        const captured = state.snapshot ? JSON.parse(state.snapshot) : currentDeployment();
        put(&#x27;manual-context&#x27;, &#x27;EmotionStat/app · dev · SHA &#x27; + captured.sha + &#x27; · запуск #&#x27; + captured.run + &#x27; / &#x27; + captured.attempt);
      }

      function renderCandidate() {
        const valid = state.selection === &#x27;122&#x27;;
        candidate.dataset.tone = state.selection ? (valid ? &#x27;good&#x27; : &#x27;bad&#x27;) : &#x27;&#x27;;
        candidate.textContent = !state.selection
          ? &#x27;Требуются Ready for agent и Agent allowed = yes.&#x27;
          : valid
            ? &#x27;#122 · Ready for agent · Agent allowed = yes · входит в разрешённый проект.&#x27;
            : &#x27;#123 недоступна: Agent allowed = no. Разрешение меняется владельцем на доске.&#x27;;
        if (state.selection &amp;&amp; !valid) candidate.setAttribute(&#x27;role&#x27;, &#x27;alert&#x27;);
        else candidate.removeAttribute(&#x27;role&#x27;);
        find(&#x27;confirm-assignment&#x27;).disabled = !valid || !canAssign();
        put(&#x27;confirm-assignment&#x27;, valid ? &#x27;Назначить #122&#x27; : &#x27;Назначить задачу&#x27;);
      }

      function render() {
        const scenario = state.scenario;
        const healthy = scenario === &#x27;restored&#x27;;
        const verifying = scenario === &#x27;validating&#x27;;
        const manualPending = scenario === &#x27;manual_pending&#x27;;
        const manualFailed = scenario === &#x27;manual_failed&#x27;;
        const manualStale = scenario === &#x27;manual_stale&#x27;;
        const assigned = [&#x27;assigned&#x27;, &#x27;review&#x27;, &#x27;validating&#x27;].includes(scenario) || (state.recoveryPresent &amp;&amp; ![&#x27;failure&#x27;, &#x27;stale&#x27;, &#x27;unavailable&#x27;].includes(scenario));
        const unavailable = scenario === &#x27;unavailable&#x27;;
        const stale = scenario === &#x27;stale&#x27;;
        const free = healthy &amp;&amp; state.originalMerged;
        const successfulDeploy = healthy || verifying || manualPending || manualFailed || (state.validationFault &amp;&amp; !manualStale);
        const waitTone = assigned || manualPending || verifying || healthy;
        const badge = find(&#x27;queue-badge&#x27;);
        badge.dataset.tone = free ? &#x27;good&#x27; : (waitTone ? &#x27;wait&#x27; : &#x27;bad&#x27;);
        put(&#x27;panel-title&#x27;, manualPending || manualFailed || manualStale || healthy ? &#x27;Проверка dev&#x27; : &#x27;Восстановление dev&#x27;);
        put(&#x27;validation-mode&#x27;, state.validationMode === &#x27;manual&#x27; ? &#x27;Вручную · smoke-тесты пока не настроены&#x27; : &#x27;Автоматически · требуется результат smoke-тестов&#x27;);
        put(&#x27;queue-badge&#x27;, free ? &#x27;Очередь готова&#x27; : &#x27;Очередь приостановлена&#x27;);
        stage(&#x27;merge&#x27;, state.originalMerged ? &#x27;Merged&#x27; : &#x27;Приостановлен&#x27;, state.originalMerged ? &#x27;good&#x27; : &#x27;wait&#x27;);
        stage(&#x27;deploy&#x27;, manualStale ? &#x27;Новый запуск&#x27; : successfulDeploy ? &#x27;Успешен&#x27; : unavailable ? &#x27;Нет данных&#x27; : &#x27;Ошибка&#x27;, successfulDeploy ? &#x27;good&#x27; : manualStale ? &#x27;wait&#x27; : &#x27;bad&#x27;);
        stage(&#x27;validation&#x27;, healthy ? &#x27;Пройдена&#x27; : manualFailed ? &#x27;Не пройдена&#x27; : manualPending ? (state.validationMode === &#x27;manual&#x27; ? &#x27;Вручную&#x27; : &#x27;Нет результата&#x27;) : verifying ? &#x27;Ожидает Queue&#x27; : &#x27;Ожидается&#x27;, healthy ? &#x27;good&#x27; : manualFailed ? &#x27;bad&#x27; : &#x27;wait&#x27;);
        stage(&#x27;next&#x27;, free ? &#x27;Допускается&#x27; : &#x27;Ожидает&#x27;, free ? &#x27;good&#x27; : &#x27;&#x27;);
        put(&#x27;source-pr&#x27;, state.originalMerged ? &#x27;#301 · merged в dev&#x27; : &#x27;#301 · работа приостановлена до восстановления dev&#x27;);
        find(&#x27;notice&#x27;).dataset.tone = healthy ? &#x27;good&#x27; : (waitTone ? &#x27;wait&#x27; : &#x27;bad&#x27;);
        let title = &#x27;Контейнер не прошёл проверку готовности&#x27;;
        let detail = &#x27;Назначьте задачу исправления или проверьте возможность повторного запуска в GitHub.&#x27;;
        let footer = &#x27;Цикл сохранён · ожидается решение владельца&#x27;;
        if (scenario === &#x27;assigned&#x27;) {
          title = &#x27;Исправление назначено&#x27;;
          detail = &#x27;Раннер допускает задачу #122. Новая ветка от текущего dev, затем PR и review.&#x27;;
          footer = &#x27;Назначение сохранено · #122 связано с текущим сбоем&#x27;;
        } else if (scenario === &#x27;review&#x27;) {
          title = &#x27;Исправление готово к review&#x27;;
          detail = &#x27;PR #302 направлен в dev. Раннер ожидает ручного merge и нового деплоя.&#x27;;
          footer = &#x27;Цикл сохранён · ожидается merge PR #302&#x27;;
        } else if (manualPending) {
          title = state.validationMode === &#x27;manual&#x27; ? &#x27;Деплой успешен. Нужна ручная проверка dev&#x27; : &#x27;Деплой успешен. Нет результата smoke-тестов&#x27;;
          detail = state.validationMode === &#x27;manual&#x27; ? &#x27;Проверьте приложение и нужные компоненты, затем сохраните результат для этой версии dev.&#x27; : &#x27;Ожидается автоматическая проверка. Отсутствие результата не переключает режим на ручной.&#x27;;
          footer = &#x27;Цикл сохранён · очередь ждёт подтверждения готовности dev&#x27;;
        } else if (manualFailed) {
          title = &#x27;Ручная проверка выявила проблему&#x27;;
          detail = &#x27;Очередь остаётся закрытой. Назначьте исправление или повторите проверку после восстановления.&#x27;;
          footer = &#x27;Отрицательный результат сохранён · требуется восстановление&#x27;;
        } else if (manualStale) {
          title = &#x27;Подтверждение относится к прежнему деплою&#x27;;
          detail = &#x27;В dev появился новый запуск. Обновите данные и проверьте актуальную версию.&#x27;;
          footer = &#x27;Результат не сохранён · очередь остаётся закрытой&#x27;;
        } else if (verifying) {
          title = &#x27;Деплой успешен. Проверка dev ещё не завершена&#x27;;
          detail = &#x27;Queue остаётся на паузе после предыдущего сбоя. Ожидается подтверждение восстановления доставки.&#x27;;
          footer = &#x27;Цикл сохранён · ожидается подтверждение готовности dev&#x27;;
        } else if (healthy) {
          title = &#x27;Работоспособность dev подтверждена&#x27;;
          detail = state.originalMerged ? &#x27;Следующая задача начнётся от проверенного dev.&#x27; : &#x27;Раннер возобновит исходную задачу #120. Следующая задача продолжит ждать.&#x27;;
          footer = state.originalMerged ? &#x27;Цикл завершён · очередь готова к следующей задаче&#x27; : &#x27;Цикл сохранён · возобновляется исходная задача #120&#x27;;
        } else if (stale) {
          title = &#x27;Состояние сбоя изменилось&#x27;;
          detail = &#x27;Появился новый запуск deployment. Обновите данные перед назначением исправления.&#x27;;
          footer = &#x27;Назначение приостановлено · требуется свежая проверка&#x27;;
        } else if (unavailable) {
          title = &#x27;Не удалось проверить состояние GitHub&#x27;;
          detail = &#x27;Данные о запуске недоступны. Назначение исправления станет доступно после успешной проверки.&#x27;;
          footer = &#x27;Цикл сохранён · состояние не подтверждено&#x27;;
        }
        put(&#x27;notice-title&#x27;, title);
        put(&#x27;notice-detail&#x27;, detail);
        put(&#x27;footer-state&#x27;, footer);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

      }

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);

      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);

  }, { once: true });
})();
